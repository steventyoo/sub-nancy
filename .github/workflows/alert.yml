name: sub-nancy daily trade alert

# Emails the team the newest congressional filings each morning.
# Runs on GitHub Actions (NOT Railway) because Railway blocks outbound SMTP
# ports — GitHub runners can reach Gmail's mail server.
on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 8am ET, weekdays
  workflow_dispatch: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send trade alert via Gmail
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          ALERT_RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}
        run: python scripts/send_alert.py
