name: sub-nancy daily trade alert

# Emails the team (Steve, Dan, Michael) the newest congressional filings
# once each morning. Separate from the hourly data sync so it's exactly
# one digest per day, not one per sync.
on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 8am ET, weekdays (filings post on weekdays)
  workflow_dispatch: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send trade alert email
        run: |
          curl -s -X POST "https://sub-nancy-production.up.railway.app/api/admin/send-trade-alert?since_days=2" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d); sys.exit(0 if d.get('sent') or d.get('reason') else 1)"
